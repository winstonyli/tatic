[package]
name = "tatic"
version.workspace = true
edition.workspace = true
license.workspace = true
# `cargo run` alone (no `--bin`) runs the scripted demo (src/bin/demo.rs) --
# `cargo run --bin repl` for the interactive REPL (src/bin/repl.rs).
default-run = "demo"

[dependencies]
blake3 = "1.8.3"
tatic-kernel.workspace = true
tatic-wasm.workspace = true
hashbrown.workspace = true
mimalloc.workspace = true
wasmtime = "42.0.1"
wat = "1.245.1"

[dev-dependencies]
criterion = "0.5"
tatic-rng.workspace = true

[[bench]]
name = "execution"
harness = false

[[bench]]
name = "proofs"
harness = false
