# Release with fat LTO, for sweeps, timing and other long runs (`cargo test --profile sweep ...`): about 9% less
# sweep CPU than `release` with identical outputs, but an incremental rebuild of the church_bv test binary takes
# minutes instead of about 27 s, so everyday `--release` builds stay without it. docs/tier-cycle.md, "Build flags".
[profile.sweep]
inherits = "release"
lto = "fat"
codegen-units = 1

# A plain `cargo test` at opt-level 1, debug assertions and `check_replay` still on: the lib suite takes 2.9 s instead of
# 32.5 s and church_bv 12 s instead of 158 s, and an edit rebuilds faster. The dependencies must be included (workspace
# only: 3x slower). The cold build is about 7 min longer. docs/tier-cycle.md, "Opt-level 0 against 1".
[profile.test]
opt-level = 1

# `tatic`, `tatic-kernel` and `tatic-rng` are the members; `tools/runs` is its own standalone crate (own lockfile and target).
# The profiles live here because Cargo ignores them in a member manifest. A virtual root has no edition, so the resolver is
# set explicitly (the root package's edition 2024 used to imply it).
[workspace]
resolver = "3"
members = ["crates/tatic", "crates/tatic-kernel", "crates/tatic-rng"]
exclude = ["tools/runs"]
