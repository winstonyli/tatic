[package]
name = "tatic"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
# Explicit [[bench]] targets only -- autodiscovery would otherwise also
# pick up benches/common.rs (shared term builders, not a benchmark itself)
# as its own empty bench target.
autobenches = false
# `cargo run` alone (no `--bin`) runs the scripted demo (src/main.rs) --
# `cargo run --bin repl` for the interactive REPL (src/bin/repl.rs).
default-run = "tatic"

[dependencies]
blake3 = "1.8.3"
hashbrown = "0.16.1"
im = "15.1.0"
mimalloc = "0.1.52"
stacker = "0.1.25"
wasmtime = "42.0.1"
wat = "1.245.1"

[dev-dependencies]
criterion = "0.5"

# Release with fat LTO, for sweeps, timing and other long runs (`cargo test --profile sweep ...`): about 9% less
# sweep CPU than `release` with identical outputs, but an incremental rebuild of the church_bv test binary takes
# minutes instead of about 27 s, so everyday `--release` builds stay without it. docs/tier-cycle.md, "Build flags".
[profile.sweep]
inherits = "release"
lto = "fat"
codegen-units = 1

[[bench]]
name = "execution"
harness = false

[[bench]]
name = "proofs"
harness = false
