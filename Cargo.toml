[package]
name = "tatic"
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"
# `cargo run` alone (no `--bin`) runs the scripted demo (src/bin/demo.rs) --
# `cargo run --bin repl` for the interactive REPL (src/bin/repl.rs).
default-run = "demo"

[dependencies]
blake3 = "1.8.3"
tatic-kernel = { path = "crates/tatic-kernel" }
hashbrown = "0.16.1"
mimalloc = "0.1.52"
wasmtime = "42.0.1"
wat = "1.245.1"

[dev-dependencies]
criterion = "0.5"
tatic-rng = { path = "crates/tatic-rng" }

# Release with fat LTO, for sweeps, timing and other long runs (`cargo test --profile sweep ...`): about 9% less
# sweep CPU than `release` with identical outputs, but an incremental rebuild of the church_bv test binary takes
# minutes instead of about 27 s, so everyday `--release` builds stay without it. docs/tier-cycle.md, "Build flags".
[profile.sweep]
inherits = "release"
lto = "fat"
codegen-units = 1

# A plain `cargo test` at opt-level 1, debug assertions and `check_replay` still on: the lib suite takes 2.9 s instead of
# 32.5 s and church_bv 12 s instead of 158 s, and an edit rebuilds faster. The dependencies must be included (workspace
# only: 3x slower). The cold build is about 7 min longer. docs/tier-cycle.md, "Opt-level 0 against 1".
[profile.test]
opt-level = 1

[[bench]]
name = "execution"
harness = false

[[bench]]
name = "proofs"
harness = false

# `tatic-kernel` and `tatic-rng` are members; `tools/runs` is its own standalone crate (own lockfile and target).
[workspace]
members = ["crates/tatic-kernel", "crates/tatic-rng"]
default-members = [".", "crates/tatic-kernel", "crates/tatic-rng"]
exclude = ["tools/runs"]
