[package]
name = "tatic-runs"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Gates, timings and machine state for tatic's church_bv sweeps (README, \"Benchmarks\")"

[[bin]]
name = "runs"
path = "src/main.rs"

[dependencies]
regex = "1.13.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
